<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML Converter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js CDN (Markdown parser) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-white shadow-sm py-4 px-6 mb-6">
        <h1 class="text-2xl font-bold text-blue-600">Markdown to HTML 変換ツール</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow container mx-auto px-4 mb-8 flex flex-col gap-4">
        
        <!-- コントロールバー（ファイル選択など） -->
        <div class="bg-white p-4 rounded-lg shadow flex flex-wrap items-center justify-between gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Markdownファイルを読み込む</label>
                <input type="file" id="fileInput" accept=".md, .markdown, .txt" 
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
            </div>
            <div class="flex gap-2 flex-wrap">
                <button id="copyHtmlBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm font-medium transition">
                    HTMLコードをコピー
                </button>
                <button id="downloadHtmlBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition">
                    HTMLファイルをダウンロード
                </button>
            </div>
        </div>

        <!-- エディターとプレビューのグリッド -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-grow">
            
            <!-- 左側：Markdown入力 -->
            <div class="bg-white p-4 rounded-lg shadow flex flex-col h-[600px]">
                <h2 class="text-lg font-semibold mb-2 text-gray-700">Markdown 入力 / 編集</h2>
                <textarea id="markdownInput" placeholder="ここにMarkdownを入力するか、ファイルを読み込んでください..." 
                    class="w-full flex-grow p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm resize-none"></textarea>
            </div>

            <!-- 右側：HTMLプレビュー -->
            <div class="bg-white p-4 rounded-lg shadow flex flex-col h-[600px]">
                <h2 class="text-lg font-semibold mb-2 text-gray-700">プレビュー</h2>
                <div id="preview" class="w-full flex-grow p-4 border border-gray-300 rounded-md overflow-y-auto bg-white prose max-w-none">
                    <!-- 変換されたHTMLがここに表示されます -->
                </div>
            </div>

        </div>

        <!-- HTMLソースコード表示エリア -->
        <div class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-lg font-semibold mb-2 text-gray-700">生成された HTML コード</h2>
            <textarea id="htmlOutput" readonly 
                class="w-full h-32 p-3 border border-gray-300 rounded-md bg-gray-50 font-mono text-xs resize-none focus:outline-none"></textarea>
        </div>

    </main>

    <!-- フッター -->
    <footer class="text-center py-4 text-gray-500 text-sm">
        &copy; 2026 MD to HTML Tool
    </footer>

    <!-- JavaScript 処理 -->
    <script>
        const markdownInput = document.getElementById('markdownInput');
        const preview = document.getElementById('preview');
        const htmlOutput = document.getElementById('htmlOutput');
        const fileInput = document.getElementById('fileInput');
        const copyHtmlBtn = document.getElementById('copyHtmlBtn');
        const downloadHtmlBtn = document.getElementById('downloadHtmlBtn');

        // Markdownを変換して画面に反映する関数
        function convertMarkdown() {
            const markdownText = markdownInput.value;
            
            // marked.js を使ってMarkdownをHTMLに変換
            const htmlContent = marked.parse(markdownText);

            // プレビューエリアに反映
            preview.innerHTML = htmlContent;

            // HTML出力エリアにソースコードを反映（こちらはタグの中身のみ）
            htmlOutput.value = htmlContent;
        }

        // テキストエリアの入力変更を監視してリアルタイム変換
        markdownInput.addEventListener('input', convertMarkdown);

        // ファイルが選択されたときの処理
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                markdownInput.value = e.target.result;
                convertMarkdown();
            };
            reader.readAsText(file);
        });

        // HTMLコードをクリップボードにコピーするボタン
        copyHtmlBtn.addEventListener('click', () => {
            if (!htmlOutput.value) {
                alert('コピーする内容がありません。');
                return;
            }
            navigator.clipboard.writeText(htmlOutput.value).then(() => {
                alert('HTMLコードをクリップボードにコピーしました！');
            }).catch(err => {
                console.error('コピーに失敗しました', err);
            });
        });

        // HTMLファイルをダウンロードするボタン
        downloadHtmlBtn.addEventListener('click', () => {
            const bodyContent = htmlOutput.value;
            if (!bodyContent.trim()) {
                alert('ダウンロードするコンテンツがありません。');
                return;
            }

            // ダウンロード用に、最低限の構造（<!DOCTYPE html>など）を持った完全なHTMLドキュメントとしてラップする
            const fullHtml = `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converted Markdown</title>
    <!-- 必要に応じてスタイルを追加できます -->
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        code { background: #f4f4f4; padding: 2px 4px; border-radius: 4px; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 4px; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px 12px; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>
${bodyContent}
</body>
</html>`;

            // Blobオブジェクトを作成してダウンロードリンクを動的に生成
            const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'converted.html'; // デフォルトのファイル名
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // 初期表示時の空の変換
        convertMarkdown();
    </script>

</body>
</html>
