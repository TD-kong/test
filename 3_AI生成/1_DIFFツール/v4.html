<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure JS GitHub風 Diff Viewer (ファイル読み込み対応)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            color: #24292e;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .input-area {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
        }
        .file-input-wrapper {
            font-size: 13px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #d1d5da;
            border-radius: 6px;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 12px;
            resize: vertical;
        }
        button.action-btn {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button.action-btn:hover {
            background-color: #2c974b;
        }

        /* GitHub風 Diff テーブルのスタイル */
        .diff-container {
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background-color: #ffffff;
            overflow-x: auto;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 12px;
            line-height: 20px;
        }
        table.diff-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        tr.diff-line {
            display: flex;
            width: 100%;
        }
        td.diff-num {
            width: 50px;
            color: #57606a;
            text-align: right;
            padding-right: 10px;
            user-select: none;
            background-color: #f6f8fa;
            border-right: 1px solid #d0d7de;
            white-space: nowrap;
            box-sizing: border-box;
        }
        td.diff-num.empty {
            background-color: #f6f8fa;
        }
        td.diff-code {
            flex: 1;
            padding-left: 10px;
            white-space: pre-wrap;
            word-break: break-all;
            box-sizing: border-box;
        }

        /* 変更行の色設定（GitHubカラー） */
        tr.diff-added {
            background-color: #e6ffec;
        }
        tr.diff-added td.diff-code {
            background-color: #ccffd8;
        }
        tr.diff-added td.diff-num {
            background-color: #ccffd8;
        }

        tr.diff-deleted {
            background-color: #ffebe9;
        }
        tr.diff-deleted td.diff-code {
            background-color: #ffd7d5;
        }
        tr.diff-deleted td.diff-num {
            background-color: #ffd7d5;
        }
        
        tr.diff-unchanged {
            background-color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GitHub風 Diff Viewer</h2>
    
    <div class="input-area">
        <!-- 変更前 -->
        <div class="input-group">
            <label for="old-text">変更前 (Original)</label>
            <div class="file-input-wrapper">
                <input type="file" id="file-old" onchange="loadFile(event, 'old-text')">
            </div>
            <textarea id="old-text">Hello World
This is line two.
Line three is here.
Unchanged line.</textarea>
        </div>
        <!-- 変更後 -->
        <div class="input-group">
            <label for="new-text">変更後 (Modified)</label>
            <div class="file-input-wrapper">
                <input type="file" id="file-new" onchange="loadFile(event, 'new-text')">
            </div>
            <textarea id="new-text">Hello GitHub!
This is line two.
New line inserted.
Unchanged line.
Added at the end.</textarea>
        </div>
    </div>

    <button class="action-btn" onclick="generateDiff()">Diffを生成する</button>

    <h2 style="margin-top: 24px;">結果</h2>
    <div class="diff-container">
        <table class="diff-table" id="diff-output"></table>
    </div>
</div>

<script>
// ファイルを読み込んでテキストエリアにセットする関数
function loadFile(event, targetId) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById(targetId).value = e.target.result;
    };
    reader.readAsText(file);
}

// 最長共通部分列（LCS）アルゴリズムによる正確な行比較
function computeLCS(oldLines, newLines) {
    const m = oldLines.length;
    const n = newLines.length;
    const dp = Array(m + 1).fill(0).map(() => Array(n + 1).fill(0));
    
    for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
            if (oldLines[i - 1] === newLines[j - 1]) {
                dp[i][j] = dp[i - 1][j - 1] + 1;
            } else {
                dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
            }
        }
    }
    
    let i = m, j = n;
    let result = [];
    while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && oldLines[i - 1] === newLines[j - 1]) {
            result.unshift({ type: 'equal', value: oldLines[i - 1] });
            i--;
            j--;
        } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
            result.unshift({ type: 'add', value: newLines[j - 1] });
            j--;
        } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
            result.unshift({ type: 'delete', value: oldLines[i - 1] });
            i--;
        }
    }
    return result;
}

function generateDiff() {
    const oldStr = document.getElementById('old-text').value;
    const newStr = document.getElementById('new-text').value;
    
    const oldLines = oldStr.split(/\r?\n/);
    const newLines = newStr.split(/\r?\n/);
    
    const output = document.getElementById('diff-output');
    output.innerHTML = '';

    const diffResult = computeLCS(oldLines, newLines);

    let oldLineNum = 1;
    let newLineNum = 1;
    let html = '';

    diffResult.forEach(item => {
        let lineClass = 'diff-unchanged';
        let sign = ' ';
        let oldNumStr = '';
        let newNumStr = '';

        if (item.type === 'equal') {
            lineClass = 'diff-unchanged';
            sign = ' ';
            oldNumStr = oldLineNum++;
            newNumStr = newLineNum++;
        } else if (item.type === 'delete') {
            lineClass = 'diff-deleted';
            sign = '-';
            oldNumStr = oldLineNum++;
            newNumStr = '';
        } else if (item.type === 'add') {
            lineClass = 'diff-added';
            sign = '+';
            oldNumStr = '';
            newNumStr = newLineNum++;
        }

        html += `
            <tr class="diff-line ${lineClass}">
                <td class="diff-num ${oldNumStr === '' ? 'empty' : ''}">${oldNumStr}</td>
                <td class="diff-num ${newNumStr === '' ? 'empty' : ''}">${newNumStr}</td>
                <td class="diff-code">${sign} ${escapeHtml(item.value)}</td>
            </tr>
        `;
    });

    output.innerHTML = html;
}

function escapeHtml(str) {
    return str.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
}

// 初期表示時に実行
generateDiff();
</script>

</body>
</html>
