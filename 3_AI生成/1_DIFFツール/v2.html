<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaco Editor GitHub風 Diff Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f6f8fa;
            color: #24292e;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }
        .toolbar {
            margin-bottom: 12px;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #2c974b;
        }
        #diff-container {
            width: 100%;
            height: 500px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            overflow: hidden;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Monaco Editor による本格的な Diff Viewer</h2>
    <div class="toolbar">
        <button onclick="toggleViewMode()">表示形式を切替 (サイドバイサイド / インライン)</button>
    </div>
    <div id="diff-container"></div>
</div>

<!-- Monaco Editor の読み込み (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script>
    let diffEditor;
    let isInline = false;

    // Monaco Editor のモジュールパス設定
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min' }});

    require(['vs/editor/editor.main'], function() {
        // 変更前のテキストモデルを作成
        const originalModel = monaco.editor.createModel(
            'Hello World\nThis is line two.\nLine three is here.\nUnchanged line.', 
            'text/plain'
        );
        
        // 変更後のテキストモデルを作成
        const modifiedModel = monaco.editor.createModel(
            'Hello GitHub!\nThis is line two.\nNew line inserted.\nUnchanged line.\nAdded at the end.', 
            'text/plain'
        );

        // Diffエディタのインスタンスを作成
        diffEditor = monaco.editor.createDiffEditor(document.getElementById('diff-container'), {
            renderSideBySide: true, // true: 左右比較, false: 上下（インライン）比較
            automaticLayout: true,  // 画面サイズ変更に追従
            theme: 'vs',            // 'vs' (ライト) または 'vs-dark' (ダークモード対応も簡単)
            readOnly: false         // 編集可能にするかどうか
        });

        // 2つのモデルをセット
        diffEditor.setModel({
            original: originalModel,
            modified: modifiedModel
        });
    });

    // 左右比較 と 上下比較 を切り替える関数
    function toggleViewMode() {
        if (!diffEditor) return;
        isInline = !isInline;
        diffEditor.updateOptions({
            renderSideBySide: !isInline
        });
    }
</script>

</body>
</html>
