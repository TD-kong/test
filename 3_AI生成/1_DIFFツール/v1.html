<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub風 Diff Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            color: #24292e;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .input-area {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        .input-group {
            flex: 1;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #d1d5da;
            border-radius: 6px;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 12px;
            resize: vertical;
        }
        button {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #2c974b;
        }

        /* Diff 画面のスタイル */
        .diff-container {
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background-color: #ffffff;
            overflow: hidden;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 12px;
            line-height: 20px;
        }
        .diff-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .diff-line {
            display: flex;
        }
        .diff-num {
            width: 50px;
            color: #57606a;
            text-align: right;
            padding-right: 10px;
            user-select: none;
            background-color: #f6f8fa;
            border-right: 1px solid #d0d7de;
            white-space: nowrap;
        }
        .diff-num.empty {
            background-color: #f6f8fa;
        }
        .diff-code {
            flex: 1;
            padding-left: 10px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* 変更行の色設定 */
        .diff-added {
            background-color: #e6ffec;
        }
        .diff-added .diff-code {
            background-color: #ccffd8;
        }
        .diff-added .diff-num {
            background-color: #ccffd8;
        }

        .diff-deleted {
            background-color: #ffebe9;
        }
        .diff-deleted .diff-code {
            background-color: #ffd7d5;
        }
        .diff-deleted .diff-num {
            background-color: #ffd7d5;
        }
        
        .diff-unchanged {
            background-color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GitHub風 Diff Viewer</h2>
    
    <div class="input-area">
        <div class="input-group">
            <label for="old-text">変更前 (Original)</label>
            <textarea id="old-text">Hello World
This is line two.
Line three is here.
Unchanged line.</textarea>
        </div>
        <div class="input-group">
            <label for="new-text">変更後 (Modified)</label>
            <textarea id="new-text">Hello GitHub!
This is line two.
New line inserted.
Unchanged line.
Added at the end.</textarea>
        </div>
    </div>

    <button onclick="generateDiff()">Diffを生成する</button>

    <h2 style="margin-top: 24px;">結果</h2>
    <div class="diff-container">
        <div id="diff-output" class="diff-table"></div>
    </div>
</div>

<script>
function generateDiff() {
    const oldStr = document.getElementById('old-text').value;
    const newStr = document.getElementById('new-text').value;
    
    const oldLines = oldStr.split(/\r?\n/);
    const newLines = newStr.split(/\r?\n/);
    
    const output = document.getElementById('diff-output');
    output.innerHTML = '';

    // 簡易的な行単位のLCS（最長共通部分列）風比較、または単純比較
    // 今回は分かりやすくシンプルなアルゴリズム（差分計算に jsondiffpatch や jsdiff ライブラリを使うのが本格的ですが、素のJSでの最小実装例を示します）
    
    // ※本格的なアルゴリズムを入れると長くなるため、簡易的な行比較のロジックを記載
    // 実際の厳密なDiffには、アルゴリズム（Myers Diffなど）か既存ライブラリの利用が推奨されます。
    
    let html = '';
    let oldIndex = 0;
    let newIndex = 0;

    // 簡易実装として両者を並行して比較するループ
    // ※厳密な長短一致を見るには外部ライブラリを使うのが一番確実です
    
    // ここでは分かりやすくするために、簡易的な行マッチング処理を行います
    const diffResult = simpleLineDiff(oldLines, newLines);

    let oldLineNum = 1;
    let newLineNum = 1;

    diffResult.forEach(item => {
        let lineClass = 'diff-unchanged';
        let sign = ' ';
        let oldNumStr = '';
        let newNumStr = '';

        if (item.type === 'equal') {
            lineClass = 'diff-unchanged';
            sign = ' ';
            oldNumStr = oldLineNum++;
            newNumStr = newLineNum++;
        } else if (item.type === 'delete') {
            lineClass = 'diff-deleted';
            sign = '-';
            oldNumStr = oldLineNum++;
            newNumStr = '';
        } else if (item.type === 'add') {
            lineClass = 'diff-added';
            sign = '+';
            oldNumStr = '';
            newNumStr = newLineNum++;
        }

        html += `
            <div class="diff-line ${lineClass}">
                <div class="diff-num ${oldNumStr === '' ? 'empty' : ''}">${oldNumStr}</div>
                <div class="diff-num ${newNumStr === '' ? 'empty' : ''}">${newNumStr}</div>
                <div class="diff-code">${sign} ${escapeHtml(item.value)}</div>
            </div>
        `;
    });

    output.innerHTML = html;
}

// 簡易的な差分検出アルゴリズム（デモ用）
function simpleLineDiff(oldLines, newLines) {
    let result = [];
    let o = 0, n = 0;
    
    while (o < oldLines.length || n < newLines.length) {
        if (o < oldLines.length && n < newLines.length && oldLines[o] === newLines[n]) {
            result.push({ type: 'equal', value: oldLines[o] });
            o++;
            n++;
        } else {
            // 簡易的に片方ずつ進めるチェック
            let foundInNew = newLines.slice(n, n + 3).indexOf(oldLines[o]);
            let foundInOld = oldLines.slice(o, o + 3).indexOf(newLines[n]);

            if (o < oldLines.length && (foundInNew === -1 || (foundInOld !== -1 && foundInOld < foundInNew))) {
                result.push({ type: 'delete', value: oldLines[o] });
                o++;
            } else if (n < newLines.length) {
                result.push({ type: 'add', value: newLines[n] });
                n++;
            } else {
                break;
            }
        }
    }
    return result;
}

function escapeHtml(str) {
    return str.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(> /g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
}

// 初期表示時に実行
generateDiff();
</script>

</body>
</html>
